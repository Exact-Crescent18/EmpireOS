<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Empire OS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">

<style>
/* ─── TOKENS ─────────────────────────────────────────────────────── */
:root {
  --bg:       #0a0a0f;
  --surface:  #13131a;
  --surface2: #1c1c27;
  --surface3: #23232f;
  --border:   rgba(255,255,255,0.07);
  --border2:  rgba(255,255,255,0.12);
  --fg:       #f0f0f8;
  --fg2:      #8888a8;
  --fg3:      #55556a;

  --laughder:   #e8ff47;
  --servasquad: #4df0b4;
  --rubber:     #ff5c3a;
  --sports:     #6c8fff;
  --trading:    #c97bff;
  --knowledge:  #ffbb3a;
  --brainstorm: #ff6ad2;
  --calendar:   #38e8ff;
  --settings:   #aaaacc;

  --radius: 14px;
  --radius-sm: 9px;
  --nav-h: 68px;

  color-scheme: dark;
  font-family: 'Inter', system-ui, sans-serif;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg:#f0f0f6; --surface:#fff; --surface2:#eaeaf2; --surface3:#e0e0ea;
    --border:rgba(0,0,0,0.07); --border2:rgba(0,0,0,0.13);
    --fg:#0d0d18; --fg2:#5a5a72; --fg3:#aaaabc; color-scheme:light;
  }
}
:root[data-theme="light"] {
  --bg:#f0f0f6; --surface:#fff; --surface2:#eaeaf2; --surface3:#e0e0ea;
  --border:rgba(0,0,0,0.07); --border2:rgba(0,0,0,0.13);
  --fg:#0d0d18; --fg2:#5a5a72; --fg3:#aaaabc; color-scheme:light;
}

*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

html, body { height:100%; background:var(--bg); color:var(--fg); overflow:hidden; }

body::before {
  content:""; position:fixed; inset:0 0 auto;
  height:env(safe-area-inset-top,0px);
  background:var(--bg); z-index:200;
}

#app {
  display:flex; flex-direction:column; height:100%;
  padding-top:env(safe-area-inset-top,0px);
}

/* ─── MAIN SCROLL ────────────────────────────────────────────────── */
#main {
  flex:1; overflow-y:auto; overflow-x:hidden;
  -webkit-overflow-scrolling:touch; scrollbar-width:none;
}
#main::-webkit-scrollbar { display:none; }

/* ─── PANELS ─────────────────────────────────────────────────────── */
.panel {
  display:none;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(var(--nav-h) + 24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
}
.panel.active { display:block; }

/* ─── PANEL HEADER ───────────────────────────────────────────────── */
.panel-hdr {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:14px;
}
.panel-title {
  font-family:'Syne',sans-serif; font-weight:800; font-size:22px;
  letter-spacing:-0.03em; color:var(--fg);
}
